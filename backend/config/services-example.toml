[http]
port = 19878

[jwt_verify]
url = "http://1.85.61.130:29001/internal/jwt_verify_config"
header = "x-internal-token"
token = "dev-internal-token-change-me"


[[db]]
name = "app"
url = "postgres://postgres:123456@localhost:15432/app"
max_connections = 10
min_connections = 1
connect_timeout = 30
idle_timeout = 600
sql_logging = false

[s3]
endpoint = "http://127.0.0.1:9000"
public_bucket = "public"
private_bucket = "private"
region = "us-east-1"
access_key = "CHANGE_ME"
secret_key = "CHANGE_ME"
user_key_salt = "please-change-to-random-long-string"

[external_search]
enabled = false
provider = "custom"
base_url = "https://CHANGE_ME_SEARCH_PROVIDER_BASE_URL"
search_endpoint = "/api/external/search"
api_key = "CHANGE_ME"
timeout_sec = 10
default_topic = "general"
default_days = 30
default_max_results = 6

# Agent runtime uses the first [[llm]] entry by default.
# Set default_llm to switch between an external provider and local Ollama.
# default_llm = "doubao-external"

[[llm]]
name = "ollama-gemma4"
base_url = "http://127.0.0.1:11434"
model = "gemma4:26b"
max_tokens = 20000
temperature = 0.2

# OpenAI-compatible external provider example. Fill this with the public
# base URL and model that can be reached from the deployment machine.
#
# [[llm]]
# name = "doubao-external"
# base_url = "https://CHANGE_ME_PUBLIC_OPENAI_COMPATIBLE_BASE_URL"
# model = "CHANGE_ME_MODEL_NAME"
# api_key = "CHANGE_ME"
# max_tokens = 20000
# temperature = 0.2
#
# If the provider exposes chat completions at a non-standard path, set:
# chat_completions_endpoint = "/v1/chat/completions"
