[http]
port = 19878

[jwt_verify]
url = "http://1.85.61.130:29001/internal/jwt_verify_config"
header = "x-internal-token"
token = "dev-internal-token-change-me"


[[db]]
name = "app"
url = "postgres://postgres:123456@localhost:15432/app"
max_connections = 10
min_connections = 1
connect_timeout = 30
idle_timeout = 600
sql_logging = false

[s3]
endpoint = "http://127.0.0.1:9000"
public_bucket = "public"
private_bucket = "private"
region = "us-east-1"
access_key = "CHANGE_ME"
secret_key = "CHANGE_ME"
user_key_salt = "please-change-to-random-long-string"

[external_search]
enabled = false
provider = "custom"
base_url = "https://CHANGE_ME_SEARCH_PROVIDER_BASE_URL"
search_endpoint = "/api/external/search"
api_key = "CHANGE_ME"
timeout_sec = 10
default_topic = "general"
default_days = 30
default_max_results = 6

[agent_runtime]
# Per worker LLM cognition timeout for interactive Agent turns.
# A timed-out node reports a structured task_node_failed/task_graph_finished
# instead of leaving the SSE stream waiting until the whole session times out.
worker_cognition_timeout_sec = 45

# Agent runtime uses Doubao by default. agent_llm_usage maps runtime features
# to configured [[llm]].name values. Do not commit real keys.
# default_llm = "doubao-thinking"
#
# [agent_llm_usage]
# default = "doubao-thinking"
# fast = "doubao-fast"
# thinking = "doubao-thinking"
# vision = "doubao-vision"

[[llm]]
name = "doubao-thinking"
base_url = "https://ark.cn-beijing.volces.com/api/v3"
model = "doubao-seed-2-0-pro-260215"
api_key = "CHANGE_ME"
max_tokens = 20000
temperature = 0.2
reasoning_effort = "high"
# Set to false for providers that support disabling thinking output
# through Chat Completions request metadata, such as Volcengine Ark.
# thinking = false

# [[llm]]
# name = "doubao-fast"
